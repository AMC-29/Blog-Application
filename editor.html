<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BlogSpace - Blog Editor</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="page-bg">

    <div class="background-carousel">
        <div class="background-slide slide-1"></div>
        <div class="background-slide slide-2"></div>
        <div class="background-slide slide-3"></div>
    </div>

    <div class="bg-overlay"></div>


    <!-- Navigation -->

    <header class="navbar">

        <div class="container nav-container">

            <a href="index.html" class="logo">
                <img src="images\auth\logo.png" alt="BlogSpace logo" class="logo-img" onerror="this.remove()">
                Blog<span>Space</span>
            </a>

            <nav>

                <a href="index.html">
                    Home
                </a>

                <div class="account-menu">
                    <button id="accountMenuBtn" class="account-btn" aria-haspopup="true" aria-expanded="false" aria-label="Account menu">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </button>

                    <div id="accountDropdown" class="account-dropdown">
                        <div class="account-dropdown-header">
                            My Account
                        </div>

                        <div class="account-dropdown-section">
                            <span class="account-dropdown-label">Preferences</span>

                            <button type="button" class="theme-toggle">
                                <span class="theme-toggle-icon">🌙</span>
                                <span class="theme-toggle-text">Dark Mode</span>
                            </button>
                        </div>

                        <button id="logoutBtn" class="account-dropdown-item danger">Logout</button>
                    </div>
                </div>

            </nav>

        </div>

    </header>


    <!-- Editor -->

    <main class="container editor-page">

        <div class="editor-header">

            <div>

                <h1 id="editorTitle">
                    Create New Blog
                </h1>

                <p>
                    Share your thoughts with the community.
                </p>

            </div>

        </div>


        <div id="editorMessage" class="message hidden"></div>


        <form id="blogForm" class="editor-form">

            <div class="form-group">

                <label for="blogTitle">
                    Blog Title
                </label>

                <input
                    type="text"
                    id="blogTitle"
                    placeholder="Enter your blog title"
                    maxlength="150"
                    required
                >

            </div>


            <div class="form-group">

                <label for="blogContent">
                    Blog Content
                </label>

                <textarea
                    id="blogContent"
                    placeholder="Write your blog here...

You can use simple Markdown:

# Heading
**Bold text**
*Italic text*
- List item"
                    required
                ></textarea>

            </div>


            <!-- Preview -->

            <div class="preview-section">

                <h3>
                    Preview
                </h3>

                <div
                    id="markdownPreview"
                    class="markdown-preview"
                >
                    Your blog preview will appear here.
                </div>

            </div>


            <div class="editor-actions">

                <a
                    href="index.html"
                    class="secondary-btn"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="primary-btn"
                >
                    <span id="saveButtonText">
                        Publish Blog
                    </span>
                </button>

            </div>

        </form>

    </main>


    <script src="js/auth.js"></script>
    <script src="js/editor.js"></script>

</body>
</html>
