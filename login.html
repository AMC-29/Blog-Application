<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BlogSpace - Login</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="auth-page">

     <div class="background-carousel">
        <div class="background-slide slide-1"></div>
        <div class="background-slide slide-2"></div>
        <div class="background-slide slide-3"></div>
    </div>

    <div class="auth-overlay"></div>
    
    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                <img src="images\auth\logo.png" alt="BlogSpace logo" class="logo-img" onerror="this.remove()">
                Blog<span>Space</span>
            </div>

            <h1>Welcome Back</h1>

            <p class="auth-subtitle">
                Login to continue to your account.
            </p>


            <div id="loginMessage" class="message hidden"></div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="primary-btn full-width"
                >
                    Login
                </button>

            </form>


            <p class="auth-footer">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>

        </div>

    </div>


    <script src="js/auth.js"></script>

</body>
</html>
