<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BlogSpace - Blog</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- Navigation -->

    <header class="navbar">

        <div class="container nav-container">

            <a href="index.html" class="logo">
                <img src="images\auth\logo.png" alt="BlogSpace logo" class="logo-img" onerror="this.remove()">
                Blog<span>Space</span>
            </a>

            <nav>

                <a href="index.html">
                    Home
                </a>

                <span id="guestLinks">

                    <a href="login.html">
                        Login
                    </a>

                    <a href="register.html" class="nav-button">
                        Register
                    </a>

                </span>


                <span id="userLinks" class="hidden">

                    <a href="editor.html">
                        Write Blog
                    </a>

                    <div class="account-menu">
                        <button id="accountMenuBtn" class="account-btn" aria-haspopup="true" aria-expanded="false" aria-label="Account menu">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </button>

                        <div id="accountDropdown" class="account-dropdown">
                            <div class="account-dropdown-header">
                                My Account
                            </div>

                            <div class="account-dropdown-section">
                                <span class="account-dropdown-label">Preferences</span>

                                <button type="button" class="theme-toggle">
                                    <span class="theme-toggle-icon">🌙</span>
                                    <span class="theme-toggle-text">Dark Mode</span>
                                </button>
                            </div>

                            <a href="editor.html" class="account-dropdown-item">Write Blog</a>
                            <button id="logoutBtn" class="account-dropdown-item danger">Logout</button>
                        </div>
                    </div>

                </span>

            </nav>

        </div>

    </header>


    <!-- Blog Content -->

    <main class="container single-blog">

        <a href="index.html" class="back-link">
            ← Back to Blogs
        </a>


        <article id="blogContent">

            <!-- JavaScript loads blog here -->

        </article>


        <div id="blogActions" class="blog-actions hidden">

            <a
                id="editBlogBtn"
                class="secondary-btn"
            >
                Edit Blog
            </a>

            <button
                id="deleteBlogBtn"
                class="danger-btn"
            >
                Delete Blog
            </button>

        </div>

    </main>


    <footer class="footer">

        <div class="container">

            <p>
                © 2026 BlogSpace. All rights reserved.
            </p>

        </div>

    </footer>


    <script src="js/auth.js"></script>
    <script src="js/blog.js"></script>

</body>
</html>
