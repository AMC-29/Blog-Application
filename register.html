<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BlogSpace - Register</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="auth-page">

     <div class="background-carousel">
        <div class="background-slide slide-1"></div>
        <div class="background-slide slide-2"></div>
        <div class="background-slide slide-3"></div>
    </div>

    <div class="auth-overlay"></div>


    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                <img src="images\auth\logo.png" alt="BlogSpace logo" class="logo-img" onerror="this.remove()">
                Blog<span>Space</span>
            </div>

            <h1>Create an Account</h1>

            <p class="auth-subtitle">
                Join our blogging community today.
            </p>


            <div id="registerMessage" class="message hidden"></div>


            <form id="registerForm">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        minlength="6"
                        required
                    >

                </div>


                <button type="submit" class="primary-btn full-width">
                    Create Account
                </button>

            </form>


            <p class="auth-footer">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </div>


    <script src="js/auth.js"></script>

</body>
</html>
